name: Publish policy digest

on:
  # Manual trigger: Actions tab → this workflow → "Run workflow" button.
  # That's how to get a fresh version on demand, not just on the weekly schedule below.
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel one that's already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # --no-state: each published page is a fresh, independent snapshot of the last 7
          # days — no need for cross-run dedupe state on a scheduled/ephemeral CI runner.
          python run_digest.py --days 7 --no-state

      - name: Prepare Pages site
        run: |
          mkdir -p site
          shopt -s nullglob
          files=(output/digest_*.html)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::run_digest.py did not produce an output/digest_*.html file — check the 'Run digest' step's log above."
            exit 1
          fi
          cp "${files[0]}" site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
